<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Explore crayfish farming packages, pond services, and farm visits at BOSSGUDO A.R.C. AQUA FARM."
  />

  <title>Home | BOSSGUDO A.R.C. AQUA FARM</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body data-page="home">

  <header class="topbar">
    <a href="index.html" class="brand">
      <img
        src="pictures/boss-gudo-logo.png"
        alt="BOSSGUDO A.R.C. AQUA FARM logo"
        class="brand-logo"
      />

      <span class="brand-name">
        BOSSGUDO
        <small>A.R.C. AQUA FARM</small>
      </span>
    </a>

    <nav class="nav" id="mainNav" aria-label="Main navigation">
      <a href="index.html" data-page="home" class="active">Home</a>
      <a href="about.html" data-page="about">About</a>
      <a href="packages.html" data-page="packages">Packages</a>
      <a href="booking.html" data-page="booking">Bookings</a>
      <a href="mybookings.html" data-page="mybookings">My Bookings</a>
      <a href="login.html" data-page="login">Log In</a>
      <a href="admin.html" data-page="admin">Admin Demo</a>
    </nav>
  </header>

  <!-- script.js renders the existing homepage here -->
  <main id="app"></main>

  <div id="modalHost"></div>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


<footer class="footer">

<div class="footer-social">
  <h3>SOCIAL</h3>

  <div class="social-links">
    <!-- Facebook -->
    <a
      href="https://www.facebook.com/profile.php?id=61575088857931"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit our Facebook page"
      title="Facebook"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.019 4.388 11.015 10.125 11.927v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.885v2.269h3.328l-.532 3.49h-2.796V24C19.612 23.088 24 18.092 24 12.073Z"
        />
      </svg>
    </a>

    <!-- YouTube -->
    <a
      href="https://www.youtube.com/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit our YouTube channel"
      title="YouTube"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="29"
        height="26"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.52 12 3.52 12 3.52s-7.505 0-9.376.53A3.016 3.016 0 0 0 .502 6.186C0 8.063 0 12 0 12s0 3.937.502 5.814a3.016 3.016 0 0 0 2.122 2.136C4.495 20.48 12 20.48 12 20.48s7.505 0 9.376-.53a3.016 3.016 0 0 0 2.122-2.136C24 15.937 24 12 24 12s0-3.937-.502-5.814ZM9.545 15.568V8.432L15.818 12l-6.273 3.568Z"
        />
      </svg>
    </a>
  </div>
</div>


  <aside class="footer-bottom">
    &copy; <span id="footerYear"></span>
    BOSSGUDO A.R.C. AQUA FARM. All rights reserved.
  </aside>
</footer>


  <button
    class="chat-launch"
    id="chatLaunch"
    type="button"
  >
    💬 Ask ARC Assistant
  </button>

  <div class="chat-box" id="chatBox">
    <div class="chat-head">
      ARC Inquiry Assistant

      <button
        class="small"
        id="chatClose"
        type="button"
        aria-label="Close assistant"
      >
        ✕
      </button>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="bubble">
        Hi! I can help with questions about packages, pond setup,
        training, and bookings. What would you like to know?
      </div>
    </div>

    <form class="chat-input" id="chatForm">
      <input
        id="chatText"
        placeholder="Ask about packages..."
        aria-label="Ask a question"
        required
      />
      <button class="primary" type="submit">Send</button>
    </form>
  </div>

  <script>
    document.getElementById("footerYear").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
